name: HEWAD COIN Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HTML and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax and local HTML references
        run: python3 .github/scripts/quality_check.py
