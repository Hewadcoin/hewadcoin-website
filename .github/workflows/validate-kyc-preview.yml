name: Validate HEWAD KYC JavaScript
on:
  push:
    branches: [feat/kyc-fullscreen-passport-review-20261123]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check KYC script syntax
        run: node --check hewad-kyc-four-step.js
