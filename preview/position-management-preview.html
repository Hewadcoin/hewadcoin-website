<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEWAD COIN · Position Management Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c11;color:#f5f2e8;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}
.app{max-width:1100px;margin:auto}.top{padding:20px;border:1px solid #80612a;border-radius:20px;background:radial-gradient(circle at 95% 0%,#e7be5d26,transparent 40%),linear-gradient(135deg,#252219,#11151c);box-shadow:0 12px 26px #0006}
.kicker{font-size:9px;letter-spacing:2px;color:#d9b55f;font-weight:900}.top h1{font-size:22px;color:#ffe9ad;margin:7px 0}.top p{color:#b9b3a2;font-size:12px;margin:0}
.notice{margin:12px 0;padding:10px 12px;border:1px solid #69552f;border-radius:10px;background:#292315;color:#e8d08f;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:15px 0}.tile{display:flex;align-items:center;gap:12px;min-height:90px;padding:14px;border:1px solid #51452d;border-radius:16px;background:linear-gradient(145deg,#24231f,#12161d);color:#f7f1df;text-align:left;cursor:pointer}.tile .ico{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:13px;background:#392e19;border:1px solid #80602a;font-size:21px}.tile b{display:block;font-size:13px;color:#f5dfa2}.tile small{display:block;margin-top:5px;color:#aeb1ba;font-size:10px}.tile .arr{margin-left:auto;color:#d9b65e;font-size:20px}
.card{margin:12px 0;padding:15px;border:1px solid #3e3a30;border-radius:16px;background:linear-gradient(145deg,#1c1f25,#11141a)}.card h3{margin:0 0 12px;color:#f0d58e;font-size:14px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{flex:1;min-width:150px}.field label{display:block;color:#c9c4b5;font-size:10px;font-weight:800;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #554a34;border-radius:10px;background:#0b0e13;color:#f8f5ec;font:inherit;font-size:12px}
button{cursor:pointer}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:9px 12px;border:1px solid #cba44e;border-radius:10px;background:linear-gradient(110deg,#9d7128,#e0bd61);color:#1b160b;font-size:10px;font-weight:900}.btn.gray{border-color:#51545d;background:#292d35;color:#f3eee1}.btn.red{border-color:#91464d;background:linear-gradient(110deg,#682d35,#a94d55);color:#fff0f0}.btn.green{border-color:#357b58;background:linear-gradient(110deg,#174b34,#2a8052);color:#edfff3}.btn.amber{border-color:#95702e;background:linear-gradient(110deg,#5e451c,#a77b2e);color:#fff5d9}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.stat{padding:11px;border:1px solid #4a422f;border-radius:13px;background:linear-gradient(145deg,#29271f,#141820)}.stat small{display:block;color:#b8ad8c;font-size:9px;font-weight:900}.stat b{display:block;margin-top:7px;color:#f5dfa0;font-size:16px}.greenText{color:#7de0a4!important}.redText{color:#ff929a!important}
.member{padding:14px;border:1px solid #45402f;border-radius:14px;background:#141820}.member b{color:#f6e2ad}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.meta span{padding:6px 8px;border:1px solid #353a43;border-radius:8px;background:#0e1218;color:#c5c7cc;font-size:9px}
.tableWrap{overflow:auto;border:1px solid #353943;border-radius:12px}.table{width:100%;min-width:720px;border-collapse:collapse;font-size:10px}.table th{padding:11px;background:#20232a;color:#e6c777;text-align:left;white-space:nowrap}.table td{padding:10px;border-top:1px solid #30343d;color:#e1e2e5;vertical-align:middle}
.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#29313a;color:#d7dce5;font-size:9px;font-weight:900}.active{background:#173c2a;color:#8fe1ad}.blocked{background:#49242a;color:#ff9da5}.pending{background:#44351c;color:#f2d080}.held{background:#40321a;color:#f4ce78}.deleted{background:#33343a;color:#c2c5cc}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.detail{padding:10px;border:1px solid #4a422f;border-radius:10px;background:#0d1117;margin:8px 0}.muted{color:#aeb2bc;font-size:11px}.hidden{display:none!important}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:560px){body{padding:10px}.grid{gap:8px}.tile{min-height:90px;padding:10px;gap:8px}.tile .ico{height:35px;flex-basis:35px;font-size:17px}.tile b{font-size:11px}.tile small{font-size:9px}.row{display:grid;grid-template-columns:1fr}.row .btn{width:100%}.stat b{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><span class="kicker">HEWAD COIN · ADMIN CONTROL CENTER</span><h1>💎 Position Management</h1><p>Premium interactive preview of the five administrator sections.</p></header>
<div class="notice">⚠️ Preview data only — these are fictional sample accounts. Buttons change this preview only and do not connect to the live wallet or database.</div>
<main id="app"></main>
</div>
<script>
(function(){
const members=[{id:'u1',name:'Ahmad Khattak',email:'ahmad@example.test',tazkira:'1402-1234-56789',ref:'H1010',card:'HDC-001010',mobile:'+93 700 000 101',kyc:'Approved',balance:12500,staked:19000,positions:[
{id:'HD101',amount:10000,status:'active',start:'2026-01-01',maturity:'2026-12-27',profit:650,loss:75,days:30},
{id:'HD102',amount:5000,status:'blocked',start:'2025-11-01',maturity:'2026-10-27',profit:200,loss:120,days:0,blockedAt:'2026-11-20 10:45',requestAt:'2026-11-27 09:20'},
{id:'HD103',amount:4000,status:'unlock_pending',start:'2025-11-20',maturity:'2026-11-15',profit:150,loss:0,days:0},
{id:'HD104',amount:4000,status:'held',start:'2026-02-10',maturity:'2027-02-05',profit:90,loss:25,days:70}
]}];
let section='home',activeMember=null;
const root=document.getElementById('app');
const money=n=>Number(n||0).toLocaleString()+' HDC';
const status=s=>({active:'🟢 ACTIVE',blocked:'🔴 BLOCKED',unlock_pending:'⏳ PENDING',unblock_pending:'🟡 UNBLOCK REQUEST',held:'⏸️ ON HOLD',completed:'✅ COMPLETED',reset:'💰 RESET',deleted:'🗑️ DELETED'}[s]||s);
const pill=s=>'<span class="pill '+s+'">'+status(s)+'</span>';
const nav=[['all','📋','All Position','Search member accounts and review every position'],['pending','⏳','Pending Position','Matured positions awaiting principal return'],['blocked','🔒','Block Position','All blocked positions with history'],['unblock','🔓','Unblock Position','Member requests awaiting admin approval'],['deleted','🗑️','Delete Position','Archived positions hidden from member view']];
function shell(title,desc,content){root.innerHTML='<button class="btn gray" id="back">‹ Control Panel</button><header class="top"><span class="kicker">POSITION WORKFLOW</span><h1>'+title+'</h1><p>'+desc+'</p></header>'+content;document.getElementById('back').onclick=home;}
function home(){section='home';root.innerHTML='<div class="grid">'+nav.map(x=>'<button class="tile" data-section="'+x[0]+'"><span class="ico">'+x[1]+'</span><span><b>'+x[2]+'</b><small>'+x[3]+'</small></span><span class="arr">›</span></button>').join('')+'</div>';root.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>openSection(b.dataset.section));}
function searchPage(){section='all';shell('📋 All Position','Search by member name, Tazkira number, email, referral code or card number.','<section class="card"><h3>🔍 Search Member Account</h3><div class="row"><div class="field"><label>SEARCH BY</label><select id="type"><option value="name">👤 Name</option><option value="tazkira">🪪 Tazkira Number</option><option value="email">📧 Email Address</option><option value="ref">🔗 Referral Code</option><option value="card">💳 Card Number</option></select></div><div class="field"><label>SEARCH VALUE</label><input id="value" placeholder="Write search value..."></div><button class="btn" id="search">🔎 Search</button></div><div id="result"></div></section>');document.getElementById('search').onclick=runSearch;document.getElementById('value').onkeydown=e=>{if(e.key==='Enter')runSearch();};}
function runSearch(){const type=document.getElementById('type').value,value=document.getElementById('value').value.trim().toLowerCase(),m=members.filter(x=>!value||String(type==='name'?x.name:type==='tazkira'?x.tazkira:type==='email'?x.email:type==='ref'?x.ref:x.card).toLowerCase().includes(value));const host=document.getElementById('result');if(!value){host.innerHTML='<p class="muted">Enter a value to search.</p>';return;}if(!m.length){host.innerHTML='<p class="muted">No matching sample account.</p>';return;}host.innerHTML=m.map((u,i)=>'<div class="member"><b>👤 '+u.name+'</b><p class="muted">'+u.email+'</p><div class="meta"><span>Tazkira: '+u.tazkira+'</span><span>Referral: '+u.ref+'</span><span>Card: '+u.card+'</span></div><button class="btn" data-open="'+i+'">Open Account</button></div>').join('');host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeMember=m[Number(b.dataset.open)];accountPage();});}
function stats(m){const all=m.positions,profit=all.reduce((s,p)=>s+p.profit,0),loss=all.reduce((s,p)=>s+p.loss,0),active=all.filter(p=>p.status==='active').length,expired=all.filter(p=>p.days===0).length;return '<div class="stats"><div class="stat"><small>ACTIVE POSITIONS</small><b>'+active+'</b></div><div class="stat"><small>TOTAL POSITIONS</small><b>'+all.length+'</b></div><div class="stat"><small>TOTAL PROFIT</small><b class="greenText">+'+money(profit)+'</b></div><div class="stat"><small>TOTAL LOSS</small><b class="redText">−'+money(loss)+'</b></div><div class="stat"><small>EXPIRED / MATURED</small><b>'+expired+'</b></div></div>';}
function actions(p){let h='';if(p.status==='active')h+='<button class="btn red" data-action="block" data-id="'+p.id+'">🔒 Block</button><button class="btn amber" data-action="hold" data-id="'+p.id+'">⏸ Hold</button><button class="btn gray" data-action="delete" data-id="'+p.id+'">🗑 Delete</button>';if(p.status==='blocked')h+='<button class="btn green" data-action="unblock" data-id="'+p.id+'">🔓 Unblock</button><button class="btn gray" data-action="delete" data-id="'+p.id+'">🗑 Delete</button>';if(p.status==='unblock_pending')h+='<button class="btn green" data-action="unblock" data-id="'+p.id+'">✓ Approve</button><button class="btn red" data-action="reject" data-id="'+p.id+'">✖ Reject</button>';if(p.status==='held')h+='<button class="btn green" data-action="resume" data-id="'+p.id+'">▶ Resume</button><button class="btn red" data-action="block" data-id="'+p.id+'">🔒 Block</button>';if(p.status==='unlock_pending')h+='<button class="btn green" data-action="reset" data-id="'+p.id+'">💰 Reset / Return HDC</button><button class="btn red" data-action="block" data-id="'+p.id+'">🔒 Block</button>';if(p.status==='deleted'&&p.days===0)h+='<button class="btn green" data-action="reset" data-id="'+p.id+'">💰 Reset / Return HDC</button>';return h;}
function table(m,rows){return '<div class="tableWrap"><table class="table"><thead><tr><th>Position ID</th><th>Amount</th><th>Status</th><th>Start</th><th>Maturity</th><th>Profit</th><th>Loss</th><th>Actions</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+p.id+'</b></td><td>'+money(p.amount)+'</td><td>'+pill(p.status)+'</td><td>'+p.start+'</td><td>'+p.maturity+'</td><td class="greenText">+'+money(p.profit)+'</td><td class="redText">−'+money(p.loss)+'</td><td>'+actions(p)+'</td></tr>').join('')+'</tbody></table></div>';}
function accountPage(){section='all';const m=activeMember;shell('👤 '+m.name,'Member account · '+m.email,'<section class="card"><div class="meta"><span>🪪 Tazkira: '+m.tazkira+'</span><span>🔗 Referral: '+m.ref+'</span><span>💳 Card: '+m.card+'</span><span>KYC: '+m.kyc+'</span></div>'+stats(m)+'<div class="meta"><span>💰 Available: '+money(m.balance)+'</span><span>🔐 Staked: '+money(m.staked)+'</span></div></section><section class="card"><h3>📊 All Member Positions</h3>'+table(m,m.positions)+'</section>');bindActions();}
function openSection(s){if(s==='all'){searchPage();return;}section=s;const names={pending:'⏳ Pending Position',blocked:'🔒 Block Position',unblock:'🔓 Unblock Position',deleted:'🗑️ Delete Position'},filters={pending:['unlock_pending'],blocked:['blocked'],unblock:['unblock_pending'],deleted:['deleted']};const rows=members.flatMap(m=>m.positions.filter(p=>filters[s].includes(p.status)).map(p=>({...p,member:m.name})));shell(names[s],'Position records are grouped neatly. Select an action to update this interactive sample.','<section class="card"><h3>'+rows.length+' position record(s)</h3>'+ (rows.length?'<div class="tableWrap"><table class="table"><thead><tr><th>User</th><th>Position</th><th>Amount</th><th>Status</th><th>Block / Request Date</th><th>Profit</th><th>Loss</th><th>Action</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+p.member+'</td><td>'+p.id+'</td><td>'+money(p.amount)+'</td><td>'+pill(p.status)+'</td><td>'+(p.blockedAt||p.requestAt||'—')+'</td><td class="greenText">+'+money(p.profit)+'</td><td class="redText">−'+money(p.loss)+'</td><td>'+actions(p)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">No sample records in this section.</p>')+'</section>');bindActions();}
function bindActions(){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const p=members.flatMap(m=>m.positions).find(x=>x.id===b.dataset.id);if(!p)return;const a=b.dataset.action;const prompts={block:'Block this position? Profit distribution will stop.',unblock:'Approve reactivation of this position?',reject:'Reject this unblock request?',hold:'Put this position on hold? Profit will pause.',resume:'Resume this position?',delete:'Hide this position from the member dashboard? Audit history remains.',reset:'Return original HDC to available balance? Only after maturity.'};if(!confirm(prompts[a]))return;if(a==='block'){p.status='blocked';p.blockedAt=new Date().toLocaleString();}if(a==='unblock'){p.status='active';p.blockedAt='';p.requestAt='';}if(a==='reject'){p.status='blocked';p.requestAt='';}if(a==='hold')p.status='held';if(a==='resume')p.status='active';if(a==='delete')p.status='deleted';if(a==='reset'){if(p.days>0){alert('This sample position has not matured yet.');return;}p.status='reset';activeMember.balance+=p.amount;activeMember.staked-=p.amount;}if(section==='all')accountPage();else openSection(section);});}
home();
})();
</script>
</body>
</html>
